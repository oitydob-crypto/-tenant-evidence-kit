name: Publish Package

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || github.event.head_commit.message == 'release: publish v0.1.2 from corrected tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure modern npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm install

      - name: Verify package
        run: npm run check

      - name: Verify publish version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            EXPECTED_TAG="v${PACKAGE_VERSION}"
            if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
              exit 1
            fi
          elif [ "${PACKAGE_VERSION}" != "0.1.2" ]; then
            echo "One-time corrected publish expected package version 0.1.2, found ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
